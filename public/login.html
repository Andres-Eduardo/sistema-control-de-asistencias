<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión — Sistema de Control de Asistencia</title>
  <link rel="icon" type="image/svg+xml" href="img/logo.svg" />
  <link rel="stylesheet" href="css/login.css" />
</head>

<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <div
          style="width:64px;height:64px;background:#85da1a;border-radius:14px;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',sans-serif;font-size:22px;font-weight:800;color:white;letter-spacing:-1px;margin:0 auto;">
          CA</div>
      </div>
      <h1 class="login-title">Sistema de Asistencia</h1>
      <p class="login-sub">Control de Asistencia — Demo</p>

      <div class="login-form">
        <div class="login-field">
          <label>Correo electrónico</label>
          <input type="email" id="loginEmail" placeholder="correo@demo.com" autocomplete="email" />
        </div>
        <div class="login-field">
          <label>Contraseña</label>
          <div class="pass-wrap">
            <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password" />
            <button class="btn-ver-pass" id="btnVerPass" tabindex="-1" type="button">
              <svg id="iconOjo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16"
                height="16">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </div>

        <div class="login-error" id="loginError"></div>

        <button class="btn-login" id="btnLogin">Ingresar</button>
      </div>
    </div>

    <div class="login-footer">Sistema de Control de Asistencia · Demo</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/login.js"></script>
</body>

</html>
